esphome:
  # El nombre define la dirección mDNS: http://garage.local (cuando está en la red del hogar)
  name: garage
  friendly_name: Asistente de Estacionamiento Autónomo
  on_boot:
    priority: 600
    then:
      - lambda: |-
          bool abierto = id(reed_porton).state;
          if (abierto) id(rele_fondo).turn_on();
          else id(rele_fondo).turn_off();

esp8266:
  board: nodemcuv2

logger:
  baud_rate: 0 # libera GPIO1/TX y GPIO3/RX para rele/reed (sacrifica log USB, mantiene OTA/web)

# Telemetría para el modal Sistema del dashboard (heap, loop, reset). Cada 30 s.
debug:
  update_interval: 30s

# Servidor Web local + API para el dashboard (ver carpeta web/).
# allowed_origins "*" permite que la página (cualquier origen) lea estados y envíe comandos.
# version 2: API REST/events idéntica a v1; v1 está deprecada y se elimina en 2027.1.0 (ya migrado).
# enable_private_network_access: Chrome exige preflight PNA para página pública -> equipo local.
web_server:
  port: 80
  version: 2
  enable_private_network_access: true
  allowed_origins:
    - "*"

wifi:
  # Sin SSID/clave en el YAML: la red del hogar se carga vía portal cautivo.
  # Si el router no está disponible, levanta el AP de abajo (abierto, solo setup).
  id: connection
  networks:
  use_address: 192.168.1.223
  min_auth_mode: WPA2 
  reboot_timeout: 0s
  ap:
    ssid: "Garage"
    manual_ip: 
      static_ip: 192.168.1.1
      gateway: 192.168.1.1
      subnet: 255.255.255.0
    ap_timeout: 30s

captive_portal:

ota:
  - platform: esphome
  - platform: web_server # habilita POST /update para el diálogo de firmware del dashboard

# Sin componente font: los 10 glifos 5x8 (READYSTOP_) van embebidos como tablas
# en el lambda del display (extraídos de spleen-5x8.bdf). Nada que subir junto al YAML.

# Variables Globales de Estado Interno
globals:
  - id: auto_estacionado_inicio
    type: bool
    initial_value: 'false'
  - id: distancia_fondo_previa
    type: float
    initial_value: '0.0'
  - id: flag_inicio
    type: bool
    initial_value: 'true'
  - id: estatico_desde_ms
    type: uint32
    initial_value: '0'
  - id: modo_ready_post_stop
    type: bool
    initial_value: 'false'
  - id: alerta_poste_on
    type: bool
    restore_value: yes
    initial_value: 'true'

# Umbrales Configurables (Ajustables dinámicamente desde la interfaz Web)
number:
  - platform: template
    name: "Tiempo Inactividad STOP (s)"
    id: tiempo_inactividad_stop
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 3
    max_value: 60
    step: 1

  - platform: template
    name: "Umbral Lateral (cm)"
    id: umbral_lateral
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 10
    max_value: 100
    step: 5

  - platform: template
    name: "Umbral Desvío Chevron (cm)"
    id: umbral_desvio_chev
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 20
    step: 0.5

  - platform: template
    name: "Umbral Poste Lateral (cm)"
    id: umbral_poste
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 5
    max_value: 40
    step: 1

  - platform: template
    name: "Umbral Inicio (cm)"
    id: umbral_inicio
    optimistic: true
    restore_value: true
    initial_value: 150
    min_value: 50
    max_value: 250
    step: 10

  - platform: template
    name: "Umbral Precaucion (cm)"
    id: umbral_precaucion
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 20
    max_value: 100
    step: 5

  - platform: template
    name: "Umbral Alerta (cm)"
    id: umbral_alerta
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 10
    max_value: 40
    step: 2

  - platform: template
    name: "Umbral STOP (cm)"
    id: umbral_stop
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 5
    max_value: 20
    step: 1

  # Dimensiones para el esquema del dashboard web (solo almacén de parámetros,
  # con restore para que persistan reboots; la lógica del firmware no los usa)
  - platform: template
    name: "Ancho Portón (cm)"
    id: ancho_porton
    optimistic: true
    restore_value: true
    initial_value: 200
    min_value: 100
    max_value: 400
    step: 5

  - platform: template
    name: "Ancho Auto (cm)"
    id: ancho_auto
    optimistic: true
    restore_value: true
    initial_value: 170
    min_value: 100
    max_value: 250
    step: 5

  - platform: template
    name: "Largo Garage (cm)"
    id: largo_garage
    optimistic: true
    restore_value: true
    initial_value: 500
    min_value: 300
    max_value: 800
    step: 10

  - platform: template
    name: "Largo Auto (cm)"
    id: largo_auto
    optimistic: true
    restore_value: true
    initial_value: 420
    min_value: 250
    max_value: 600
    step: 10

  # Ancho total con espejos: SOLO para el esquema web (el firmware no lo usa
  # en la lógica; los laterales miran la carrocería por debajo de los espejos).
  # Con restore para que persista entre dispositivos que miren el dashboard.
  - platform: template
    name: "Ancho Auto con espejos (cm)"
    id: ancho_auto_espejos
    optimistic: true
    restore_value: true
    initial_value: 190
    min_value: 100
    max_value: 300
    step: 1

  # Distancias manuales para la opción "Manual" del Modo Prueba (0 = sin eco).
  # Sin restore: tras un corte vuelven a 0 y nunca quedan distancias forzadas.
  - platform: template
    name: "Prueba Fondo (cm)"
    id: prueba_fondo
    optimistic: true
    restore_value: false
    initial_value: 0
    min_value: 0
    max_value: 400
    step: 1

  - platform: template
    name: "Prueba Izquierda (cm)"
    id: prueba_izq
    optimistic: true
    restore_value: false
    initial_value: 0
    min_value: 0
    max_value: 200
    step: 1

  - platform: template
    name: "Prueba Derecha (cm)"
    id: prueba_der
    optimistic: true
    restore_value: false
    initial_value: 0
    min_value: 0
    max_value: 200
    step: 1

# Reed portón (NO a GND) en GPIO3/RX + relé fondo en GPIO1/TX (HW-482 LOW)
# GPIO1/TX glitch HIGH en boot = relé OFF seguro con inverted:true
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Porton"
    id: reed_porton
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - switch.turn_on: rele_fondo
    on_release:
      then:
        - switch.turn_off: rele_fondo
    on_state:
      then:
        - lambda: |-
            // Publica estado para debug web (opcional)
            ESP_LOGD("porton", "Porton %s", x ? "ABIERTO" : "CERRADO");

output:
  - platform: gpio
    pin: GPIO1
    id: relay_out
    inverted: true

# Interruptor para activar/desactivar la alerta de poste (activada por defecto)
switch:
  - platform: output
    name: "Rele Fondo"
    id: rele_fondo
    output: relay_out
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Alerta Poste Lateral"
    id: sw_poste
    lambda: 'return id(alerta_poste_on);'
    turn_on_action:
      - lambda: 'id(alerta_poste_on) = true;'
    turn_off_action:
      - lambda: 'id(alerta_poste_on) = false;'

# Modo de prueba: fuerza un estado de la máquina en la matriz con valores
# sintéticos y sensores congelados, u opción "Manual" con distancias
# ingresadas a mano (numbers Prueba Fondo/Izquierda/Derecha, 0 = sin eco)
# evaluadas por la máquina de estados real. Siempre arranca en Automático
# por seguridad (sin restore: un corte del portón nunca deja el equipo
# forzado en un estado; los numbers de prueba tampoco restauran).
select:
  - platform: template
    name: "Modo Prueba"
    id: modo_prueba
    optimistic: true
    restore_value: false
    options:
      - "Automático"
      - "READY"
      - "Retroceso"
      - "Alineación centrada"
      - "Alineación corregir izq"
      - "Alineación corregir der"
      - "Aproximación Normal"
      - "Aproximación Precaución"
      - "Aproximación Alerta"
      - "STOP"
      - "Peligro Poste"
      - "Inactividad"
      - "Manual"
    initial_option: "Automático"

# Botón de reinicio en la interfaz web propia de ESPHome
button:
  - platform: restart
    name: "Reiniciar"
    id: device_restart
  - platform: factory_reset
    name: "Resetear a fabrica"

# Sensores Ultrasonido HC-SR04 (disparo secuencial round-robin + salida en cm)
# Fondo: trigger en GPIO16 (salida OK) y echo en GPIO12 (con interrupciones).
# GPIO16 no es apto como echo en ESP8266 (pin especial RTC sin interrupciones).
# Los 3 sensores usan update_interval: never y se disparan por turnos (ver interval),
# con 70 ms de separación garantizada para que ningún eco interfiera con otro.
sensor:
  - platform: ultrasonic
    trigger_pin: GPIO16
    echo_pin: GPIO12
    name: "Sensor Fondo"
    id: sensor_fondo
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0 # Conversión m a cm
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: ultrasonic
    trigger_pin: GPIO0
    echo_pin: GPIO5
    name: "Sensor Izquierda"
    id: sensor_izq
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: ultrasonic
    trigger_pin: GPIO15
    echo_pin: GPIO4
    name: "Sensor Derecha"
    id: sensor_der
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  # Telemetría del modal Sistema (dashboard)
  - platform: debug
    free:
      name: "Heap Libre"
    block:
      name: "Bloque Máx"
    fragmentation:
      name: "Fragmentación"
    loop_time:
      name: "Loop"
    cpu_frequency:
      name: "CPU"
  - platform: uptime
    name: "Tiempo Encendido"
    update_interval: 30s
  - platform: wifi_signal
    name: "WiFi"
    id: wifi_dbm
    update_interval: 30s

# Disparo secuencial por turnos (round-robin cada 70 ms -> cada sensor se mide cada 210 ms)
interval:
  - interval: 70ms
    then:
      - lambda: |-
          static uint8_t turno = 0;
          // En Modo Prueba los sensores se congelan (valores sintéticos en matriz)
          if (id(modo_prueba).current_option() != "Automático") return;
          if (turno == 0) {
            id(sensor_fondo).update();
          } else if (turno == 1) {
            id(sensor_izq).update();
          } else {
            id(sensor_der).update();
          }
          turno = (turno + 1) % 3;

# Sensores de Texto para Simulación Web
text_sensor:
  - platform: template
    name: "Modo del Sistema"
    id: modo_sistema
    icon: "mdi:garage"

  - platform: template
    name: "Simulación de Pantalla LED (8x32)"
    id: texto_pantalla
    icon: "mdi:led-strip-scan"

  # Telemetría del modal Sistema (dashboard)
  - platform: debug
    device:
      name: "Info Dispositivo"
    reset_reason:
      name: "Motivo Reinicio"
  - platform: version
    name: "Versión ESPHome"
  - platform: wifi_info
    ip_address:
      name: "IP"
    ssid:
      name: "Red WiFi"
    bssid:
      name: "BSSID"
    mac_address:
      name: "MAC"
  - platform: template
    name: "Firmware"
    icon: "mdi:memory"
    lambda: 'return __DATE__ " " __TIME__;'

# Nombre de la cochera para el dashboard web (solo etiqueta visible;
# la lógica del firmware no lo usa). Con restore para que persista
# entre dispositivos que miren la web.
text:
  - platform: template
    name: "Nombre Cochera"
    id: nombre_cochera
    optimistic: true
    restore_value: true
    initial_value: "Cochera"
    min_length: 1
    max_length: 64
    mode: TEXT

# Bus SPI y Matriz LED MAX7219 (GPIO14 dedicado a CLK, CS en GPIO2)
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

display:
  - platform: max7219digit
    cs_pin: GPIO2
    num_chips: 4
    id: matriz_led
    scroll_enable: false
    update_interval: 100ms
    lambda: |-
      static int frame_counter = 0;
      frame_counter++;

      // Restaurar modo normal por defecto (STOP usa inversión parpadeante)
      // e intensidad máxima (solo STOP/alerta/poste la bajan en su rama)
      it.invert_on_off(false);
      it.set_intensity(15);

      // Publicar solo cuando el valor cambia (evita saturar web_server y churn de heap:
      // se compara sin alocar y solo se construye std::string al publicar de verdad)
      static std::string last_modo = "";
      static std::string last_pantalla = "";
      auto publish_modo = [&](const char *m) {
        if (last_modo != m) {
          last_modo = m;
          id(modo_sistema).publish_state(m);
        }
      };
      auto publish_pantalla = [&](const char *t) {
        if (last_pantalla != t) {
          last_pantalla = t;
          id(texto_pantalla).publish_state(t);
        }
      };

      // Rango X recortado en los dígitos: la barra lo tapa y se ve invertido
      int carve_x0 = 0;
      int carve_x1 = -1;

      // Dígitos 3x6 del usuario (num.gif, tira 1-9,0): 6 filas x 3 bits, avance 4
      static const uint8_t DIG36[10][6] = {
        {0b111, 0b101, 0b101, 0b101, 0b101, 0b111}, // 0
        {0b110, 0b010, 0b010, 0b010, 0b010, 0b111}, // 1
        {0b111, 0b001, 0b111, 0b100, 0b100, 0b111}, // 2
        {0b111, 0b001, 0b011, 0b001, 0b001, 0b111}, // 3
        {0b101, 0b101, 0b101, 0b111, 0b001, 0b001}, // 4
        {0b111, 0b100, 0b111, 0b001, 0b001, 0b111}, // 5
        {0b111, 0b100, 0b111, 0b101, 0b101, 0b111}, // 6
        {0b111, 0b001, 0b001, 0b001, 0b001, 0b001}, // 7
        {0b111, 0b101, 0b111, 0b101, 0b101, 0b111}, // 8
        {0b111, 0b101, 0b101, 0b111, 0b001, 0b111}, // 9
      };
      auto draw_digit36 = [&](int x, int y, int d) {
        for (int r = 0; r < 6; r++) {
          for (int c = 0; c < 3; c++) {
            int px = x + c;
            if (DIG36[d][r] & (1 << (2 - c))) {
              if (px >= carve_x0 && px <= carve_x1) {
                // Dentro de la barra: borra el píxel (calado en negativo)
                it.draw_pixel_at(px, y + r, esphome::display::COLOR_OFF);
              } else {
                it.draw_pixel_at(px, y + r, esphome::display::COLOR_ON);
              }
            }
          }
        }
      };
      auto draw_num36 = [&](int x, int y, int n) {
        if (n < 0) n = 0;
        if (n > 999) n = 999;
        if (n >= 100) {
          draw_digit36(x, y, n / 100);
          draw_digit36(x + 4, y, (n / 10) % 10);
          draw_digit36(x + 8, y, n % 10);
        } else if (n >= 10) {
          draw_digit36(x, y, n / 10);
          draw_digit36(x + 4, y, n % 10);
        } else {
          draw_digit36(x, y, n);
        }
      };
      // Marquesina ^ del usuario (chev_arriba_normal.gif): 4 frames 7x8.
      // Calado por píxel como dígitos y número: lo tapado por la barra va OFF.
      static const uint8_t CHEVUP[4][8] = {
        {0b0011100, 0b0110110, 0b1100011, 0b1001001, 0b0011100, 0b0110110, 0b1100011, 0b1001001}, // f0
        {0b0110110, 0b1100011, 0b1001001, 0b0011100, 0b0110110, 0b1100011, 0b1001001, 0b0011100}, // f1
        {0b1100011, 0b1001001, 0b0011100, 0b0110110, 0b1100011, 0b1001001, 0b0011100, 0b0110110}, // f2
        {0b1001001, 0b0011100, 0b0110110, 0b1100011, 0b1001001, 0b0011100, 0b0110110, 0b1100011}, // f3
      };
      auto draw_chevup = [&](int x, int fi, bool vflip) {
        for (int r = 0; r < 8; r++) {
          uint8_t bits = CHEVUP[fi & 3][vflip ? (7 - r) : r];
          for (int c = 0; c < 7; c++) {
            int px = x + c;
            if (bits & (1 << (6 - c))) {
              if (px >= carve_x0 && px <= carve_x1) {
                it.draw_pixel_at(px, r, esphome::display::COLOR_OFF);
              } else {
                it.draw_pixel_at(px, r, esphome::display::COLOR_ON);
              }
            }
          }
        }
      };
      // Marquesina > del usuario (chev_der.gif 7x5): 4 frames. < se espeja.
      static const uint8_t CHEVDER[4][5] = {
        {0b1100110, 0b0110011, 0b0011001, 0b0110011, 0b1100110}, // f0
        {0b0110011, 0b0011001, 0b0001100, 0b0011001, 0b0110011}, // f1
        {0b0011001, 0b1001100, 0b1100110, 0b1001100, 0b0011001}, // f2
        {0b1001100, 0b1100110, 0b0110011, 0b1100110, 0b1001100}, // f3
      };
      auto mirror7 = [](uint8_t v) -> uint8_t {
        return ((v & 0x40) >> 6) | ((v & 0x20) >> 4) | ((v & 0x10) >> 2) | (v & 0x08) |
               ((v & 0x04) << 2) | ((v & 0x02) << 4) | ((v & 0x01) << 6);
      };
      auto draw_chevder = [&](int x, int y, int fi, bool mirror) {
        for (int r = 0; r < 5; r++) {
          uint8_t bits = CHEVDER[fi & 3][r];
          if (mirror) bits = mirror7(bits);
          for (int c = 0; c < 7; c++) {
            if (bits & (1 << (6 - c))) {
              it.draw_pixel_at(x + c, y + r, esphome::display::COLOR_ON);
            }
          }
        }
      };

      // Glifos 5x8 propios (extraídos de spleen-5x8.bdf; sin archivo externo).
      // Orden: R,E,A,D,Y,S,T,O,P,_ — avance 5px, idéntico a la fuente original.
      static const uint8_t GLYPH58[10][8] = {
        {0b00000, 0b11100, 0b10010, 0b10010, 0b11100, 0b10010, 0b10010, 0b00000}, // R
        {0b00000, 0b01110, 0b10000, 0b11100, 0b10000, 0b10000, 0b01110, 0b00000}, // E
        {0b00000, 0b01100, 0b10010, 0b10010, 0b11110, 0b10010, 0b10010, 0b00000}, // A
        {0b00000, 0b11100, 0b10010, 0b10010, 0b10010, 0b10010, 0b11100, 0b00000}, // D
        {0b00000, 0b10010, 0b10010, 0b10010, 0b01110, 0b00010, 0b11100, 0b00000}, // Y
        {0b00000, 0b01110, 0b10000, 0b01100, 0b00010, 0b00010, 0b11100, 0b00000}, // S
        {0b00000, 0b11111, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00000}, // T
        {0b00000, 0b01100, 0b10010, 0b10010, 0b10010, 0b10010, 0b01100, 0b00000}, // O
        {0b00000, 0b11100, 0b10010, 0b10010, 0b11100, 0b10000, 0b10000, 0b00000}, // P
        {0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b11110}, // _
      };
      auto glyph58_idx = [&](char c) -> int {
        switch (c) {
          case 'R': return 0; case 'E': return 1; case 'A': return 2; case 'D': return 3;
          case 'Y': return 4; case 'S': return 5; case 'T': return 6; case 'O': return 7;
          case 'P': return 8; case '_': return 9;
          default: return -1;
        }
      };
      auto draw_text58 = [&](int x, int y, const char *s) {
        int cx = x;
        for (const char *p = s; *p; p++) {
          int g = glyph58_idx(*p);
          if (g >= 0) {
            for (int r = 0; r < 8; r++) {
              for (int c = 0; c < 5; c++) {
                if (GLYPH58[g][r] & (1 << (4 - c))) {
                  it.draw_pixel_at(cx + c, y + r, esphome::display::COLOR_ON);
                }
              }
            }
          }
          cx += 5;
        }
      };
      // STOP gigante: mapa de bits libre de 32x8 (bit 31 = x0), dibujo del usuario.
      // Se dibuja en ON igual que draw_text58: con la matriz invertida el ON se ve
      // apagado sobre el fondo encendido (la inversión niega el framebuffer al enviar).
      static const uint32_t STOP32[8] = {
        0x00000000, 0x7EFEFEFE, 0x6018C2C2, 0x7F18C2C2,
        0x0318C2FE, 0x0318C2C0, 0x7F18FEC0, 0x00000000,
      };
      auto draw_stop_big = [&]() {
        for (int y = 0; y < 8; y++) {
          for (int x = 0; x < 32; x++) {
            if (STOP32[y] & (1UL << (31 - x))) {
              it.draw_pixel_at(x, y, esphome::display::COLOR_ON);
            }
          }
        }
      };
      // WiFi 6x8 de anim/wifi.gif (0x1e = 011110 = 4px sólidos) y anim/no_wifi.gif
      // Wifi: filas 0 y 7 vacías, filas 1-6 cols 1-4 sólidos (6x8 total, margen 1px)
      static const uint8_t WIFI_GIF[8] = {
        0b000000, // 0x00 ......
        0b011110, // 0x1e .####.
        0b011110, // 0x1e .####.
        0b011110, // 0x1e .####.
        0b011110, // 0x1e .####.
        0b011110, // 0x1e .####.
        0b011110, // 0x1e .####.
        0b000000, // 0x00 ......
      };
      static const uint8_t NOWIFI_GIF[8] = {
        0b101010, // 0x2a #.#.#.
        0b011111, // 0x1f .#####
        0b111110, // 0x3e #####.
        0b011111, // 0x1f .#####
        0b111110, // 0x3e #####.
        0b011111, // 0x1f .#####
        0b111110, // 0x3e #####.
        0b010101, // 0x15 .#.#.#
      };
      // Espera: radar punto 2x2 rebotando en 8..30 a 100ms/paso + WiFi 6x8 en 0,0.
      // Solo en espera (REPOSO/ARRANQUE/INACTIVIDAD); otros modos usan pantalla completa.
      // - STA conectado: wifi lleno parcial según RSSI (wifi_dbm, 4 niveles)
      // - Sin STA y sin AP: nowifi.gif fijo
      // - AP activo sin STA: wifi lleno parpadeando 500ms
      auto draw_idle_standby = [&]() {
        // --- WiFi 6x8 en 0,0 con margen 1px ---
        bool sta_connected = esphome::wifi::global_wifi_component->is_connected();
        bool ap_active = (WiFi.getMode() & WIFI_AP) != 0;
        bool ap_only = ap_active && !sta_connected;
        bool blink_on = ((frame_counter / 5) % 2 == 0); // 500 ms ON/OFF para AP
        if (ap_only) {
          // AP: cuadrado lleno (wifi.gif) parpadeando
          if (blink_on) {
            for (int r = 0; r < 8; r++) {
              uint8_t bits = WIFI_GIF[r];
              for (int c = 0; c < 6; c++) {
                if (bits & (1 << (5 - c))) it.draw_pixel_at(c, r, esphome::display::COLOR_ON);
              }
            }
          }
        } else if (!sta_connected) {
          // Sin conexión: nowifi.gif
          for (int r = 0; r < 8; r++) {
            uint8_t bits = NOWIFI_GIF[r];
            for (int c = 0; c < 6; c++) {
              if (bits & (1 << (5 - c))) it.draw_pixel_at(c, r, esphome::display::COLOR_ON);
            }
          }
        } else {
          // Conectado: llenado según wifi_dbm (4 niveles, id wifi_dbm)
          float rssi = id(wifi_dbm).state;
          int fill_rows = 6; // default lleno si NaN
          if (!isnan(rssi)) {
            if (rssi > -55) fill_rows = 6;       // excelente: 6/6
            else if (rssi > -67) fill_rows = 4;  // bueno: 4/6
            else if (rssi > -75) fill_rows = 3;  // regular: 3/6
            else if (rssi > -82) fill_rows = 2;  // débil: 2/6
            else fill_rows = 1;                  // muy débil: 1/6
          }
          // Dibuja solo filas inferiores del rectángulo 4x6 (filas 1-6, cols 1-4)
          // 6 filas totales en y=1..6; fill_rows desde abajo: y_start = 7 - fill_rows
          int y_start = 7 - fill_rows; // 1 para 6, 3 para 4, 4 para 3, 5 para 2, 6 para 1
          if (y_start < 1) y_start = 1;
          for (int r = y_start; r <= 6; r++) {
            for (int c = 1; c <= 4; c++) {
              it.draw_pixel_at(c, r, esphome::display::COLOR_ON);
            }
          }
        }
        // --- Radar punto 2x2 en 8..31 (reservado 0-7 para WiFi) ---
        // Rango 8..30 inclusive (2px ancho cabe hasta 31), rebote KITT a 1px/frame =100ms
        const int R_MIN = 8;
        const int R_MAX = 30;
        const int R_RANGE = R_MAX - R_MIN; // 22
        const int R_PERIOD = R_RANGE * 2;  // 44
        int p = frame_counter % R_PERIOD;
        if (p > R_RANGE) p = R_PERIOD - p;
        int rx = R_MIN + p;
        // centrado vertical en filas 3-4 (2px alto) — 4 píxeles ON
        it.draw_pixel_at(rx, 3, esphome::display::COLOR_ON);
        it.draw_pixel_at(rx + 1, 3, esphome::display::COLOR_ON);
        it.draw_pixel_at(rx, 4, esphome::display::COLOR_ON);
        it.draw_pixel_at(rx + 1, 4, esphome::display::COLOR_ON);
      };

      // === Máquina de estados: evaluación separada del dibujado ===
      // evalua_modo() decide (pura decisión + histéresis/temporizadores),
      // dibuja_modo() renderiza. Mismo orden y umbrales que la cadena original.
      enum class Modo : uint8_t {
        REPOSO_READY, ARRANQUE_LISTO, RETROCESO,
        ALIN_CENTRADA, ALIN_DESV_DER, ALIN_DESV_IZQ,
        APROX_NORMAL, APROX_PRECAUCION, APROX_ALERTA,
        STOP_CRITICO, POSTE_PELIGRO, INACTIVIDAD_READY
      };
      struct Entradas { float fondo; float izq; float der; };
      struct Eval { Modo modo; bool dev_der; bool dev_izq; };

      // Histéresis de 2 cm (evita parpadeo en fronteras): se entra con el nominal y se sale con + margen.
      static const float HIST_CM = 2.0;
      static bool h_stop = false;
      static bool h_alerta = false;
      static bool h_prec = false;
      static bool h_ini = false;
      static bool h_lat = false;
      static bool h_poste = false;
      static bool h_dev_der = false;
      static bool h_dev_izq = false;

      // Entra con v <= lim, sale con v > lim + HIST_CM
      auto hyst_le = [&](bool &s, float v, float lim) {
        if (s) s = (v <= lim + HIST_CM);
        else s = (v <= lim);
      };
      // Entra con v > lim, sale con v < lim - 1 (para desvíos)
      auto hyst_gt = [&](bool &s, float v, float lim) {
        if (s) s = !(v < lim - 1.0);
        else s = (v > lim);
      };

      // Decide el modo a partir de las entradas. Conserva el orden de precedencia
      // original: alineación (absoluta, no depende del fondo) → fondo inválido →
      // arranque → retroceso → STOP/inactividad → aproximación → reposo.
      // Efectos laterales idénticos a los originales (temporizadores y siembra).
      auto evalua_modo = [&](const Entradas &e, uint32_t ahora) -> Eval {
        float fondo = e.fondo, izq = e.izq, der = e.der;

        // Validación de alineación: AMBOS sensores deben detectar el auto <= umbral
        float lim_lat = id(umbral_lateral).state + (h_lat ? HIST_CM : 0.0);
        bool auto_lat_izq = (!isnan(izq) && izq > 0.0 && izq <= lim_lat);
        bool auto_lat_der = (!isnan(der) && der > 0.0 && der <= lim_lat);
        bool pres_lateral = auto_lat_izq && auto_lat_der;
        h_lat = pres_lateral;

        float lat_min = (izq < der) ? izq : der;
        hyst_le(h_poste, lat_min, id(umbral_poste).state);
        hyst_gt(h_dev_der, izq - der, id(umbral_desvio_chev).state);
        hyst_gt(h_dev_izq, der - izq, id(umbral_desvio_chev).state);

        // Alineación lateral (prioritaria)
        if (pres_lateral) {
          if (id(alerta_poste_on) && h_poste && ((frame_counter / 5) % 2 == 1)) {
            return {Modo::POSTE_PELIGRO, h_dev_der, h_dev_izq};
          }
          if (h_dev_der) return {Modo::ALIN_DESV_DER, true, false};
          if (h_dev_izq) return {Modo::ALIN_DESV_IZQ, false, true};
          return {Modo::ALIN_CENTRADA, false, false};
        }

        // Lectura inválida: reposo (no toca temporizadores ni distancia previa)
        if (isnan(fondo) || fondo <= 0.0) {
          return {Modo::REPOSO_READY, false, false};
        }

        hyst_le(h_stop, fondo, id(umbral_stop).state);
        hyst_le(h_alerta, fondo, id(umbral_alerta).state);
        hyst_le(h_prec, fondo, id(umbral_precaucion).state);
        hyst_le(h_ini, fondo, id(umbral_inicio).state);

        float prev = id(distancia_fondo_previa);
        float diff = fabsf(fondo - prev);
        bool en_movimiento = (diff > 1.0);
        bool retrocediendo = (prev > 0.0) && (fondo > prev + 1.0);
        id(distancia_fondo_previa) = fondo;

        if (en_movimiento) {
          id(estatico_desde_ms) = ahora;
          id(modo_ready_post_stop) = false;
        } else if (id(estatico_desde_ms) == 0) {
          id(estatico_desde_ms) = ahora;
        }

        uint32_t tiempo_estatico_ms = ahora - id(estatico_desde_ms);
        uint32_t limite_inactividad_ms = (uint32_t)(id(tiempo_inactividad_stop).state * 1000.0);

        if (id(flag_inicio)) {
          id(distancia_fondo_previa) = fondo;
          retrocediendo = false;
          if (fondo <= id(umbral_alerta).state) {
            id(auto_estacionado_inicio) = true;
          }
          id(flag_inicio) = false;
        }

        if (retrocediendo || fondo < prev - 2.0) {
          id(auto_estacionado_inicio) = false;
        }

        if (id(auto_estacionado_inicio) && !retrocediendo) {
          return {Modo::ARRANQUE_LISTO, false, false};
        }

        if (retrocediendo) {
          return {Modo::RETROCESO, false, false};
        }

        if (h_stop) {
          if (tiempo_estatico_ms >= limite_inactividad_ms) {
            id(modo_ready_post_stop) = true;
          }
          if (id(modo_ready_post_stop)) {
            return {Modo::INACTIVIDAD_READY, false, false};
          }
          return {Modo::STOP_CRITICO, false, false};
        }

        if (h_ini) {
          if (h_alerta) return {Modo::APROX_ALERTA, false, false};
          if (h_prec) return {Modo::APROX_PRECAUCION, false, false};
          return {Modo::APROX_NORMAL, false, false};
        }

        return {Modo::REPOSO_READY, false, false};
      };

      // Renderiza el modo decidido. Usa solo Entradas + flags de desvío.
      auto dibuja_modo = [&](Modo m, const Entradas &e, bool dev_der, bool dev_izq) {
        float fondo = e.fondo, izq = e.izq, der = e.der;
        switch (m) {
          case Modo::POSTE_PELIGRO:
            it.invert_on_off(true);
            it.set_intensity(12);
            draw_stop_big();
            break;
          case Modo::ALIN_CENTRADA:
          case Modo::ALIN_DESV_DER:
          case Modo::ALIN_DESV_IZQ: {
            float dif_mm = (izq - der) * 10.0;
            int ni = (int)izq;
            int nd = (int)der;
            if (ni < 0) ni = 0;
            if (ni > 99) ni = 99;
            if (nd < 0) nd = 0;
            if (nd > 99) nd = 99;
            bool centrado = (!dev_der && !dev_izq);
            int pos_x = 15 + (int)(dif_mm / 20.0);
            if (pos_x < 0) pos_x = 0;
            if (pos_x > 31) pos_x = 31;
            int bar_x0, bar_x1;
            if (centrado) { bar_x0 = 15; bar_x1 = 16; }
            else if (pos_x > 16) { bar_x0 = 16; bar_x1 = pos_x; }
            else { bar_x0 = pos_x; bar_x1 = 15; }
            carve_x0 = bar_x0;
            carve_x1 = bar_x1;
            int fi = frame_counter % 4; // ~100 ms/frame = velocidad aprox. normal
            if (dev_der) {
              // Pegado a DERECHA: marquesina espejada (corre a la izquierda)
              draw_chevder(8, 1, fi, true);
            }
            if (dev_izq) {
              // Pegado a IZQUIERDA: marquesina a la derecha (corre a la derecha)
              draw_chevder(17, 1, fi, false);
            }
            for (int x = bar_x0; x <= bar_x1; x++) {
              it.vertical_line(x, 0, 8);
            }
            draw_num36(0, 1, ni);
            int wd = (nd >= 10) ? 7 : 3; // 2 digitos 4+3=7 -> x=25 (contra borde)
            draw_num36(32 - wd, 1, nd);
            break;
          }
          case Modo::RETROCESO: {
            // Misma marquesina ^ pero invertida verticalmente: baja.
            int fi = (frame_counter / 3) % 4;
            draw_chevup(1, fi, true);
            draw_chevup(24, fi, true);
            break;
          }
          case Modo::STOP_CRITICO:
            it.invert_on_off(true);
            if ((frame_counter / 3) % 2 == 0) {
              it.set_intensity(12);
            } else {
              it.set_intensity(7);
            }
            draw_stop_big();
            break;
          case Modo::APROX_NORMAL:
          case Modo::APROX_PRECAUCION:
          case Modo::APROX_ALERTA: {
            if (m == Modo::APROX_ALERTA) {
              if ((frame_counter / 3) % 2 == 0) {
                it.set_intensity(12);
              } else {
                it.set_intensity(7);
              }
            }
            float u_ini = id(umbral_inicio).state;
            float u_stop = id(umbral_stop).state;
            float denom = u_ini - u_stop;
            if (denom < 1.0) denom = 1.0;
            // Barra 0..23 (100% en x=23); chevrones en zona 25..31 (col 24 libre)
            int fill = (int)(((u_ini - fondo) / denom) * 24.0);
            if (fill < 0) fill = 0;
            if (fill > 24) fill = 24;
            carve_x0 = 0;
            carve_x1 = fill - 1;
            for (int x = 0; x < fill; x++) {
              it.vertical_line(x, 0, 8);
            }
            int nf = (int)(fondo + 0.5);
            draw_num36(0, 1, nf);
            // Velocidad continua del chevrón (sin saltos entre tiers): interpola
            // 0.5 frames/tick en umbral_precaucion hasta 1 frame/tick en
            // umbral_inicio. Fase fraccional acumulada; los tiers discretos
            // (textos, parpadeo) siguen por histéresis como siempre.
            static float chev_phase = 0.0f;
            float u_prec = id(umbral_precaucion).state;
            float span = u_ini - u_prec;
            if (span < 1.0) span = 1.0;
            float tvel = (fondo - u_prec) / span;
            if (tvel < 0.0f) tvel = 0.0f;
            if (tvel > 1.0f) tvel = 1.0f;
            chev_phase += 0.5f + 0.5f * tvel;
            if (chev_phase >= 4.0f) chev_phase -= 4.0f;
            draw_chevup(25, (int)chev_phase, false);
            break;
          }
          case Modo::REPOSO_READY:
          case Modo::ARRANQUE_LISTO:
          case Modo::INACTIVIDAD_READY:
          default:
            draw_idle_standby();
            break;
        }
      };

      // Orquestación: entradas reales o sintéticas (Modo Prueba), evaluar, dibujar, publicar.
      uint32_t ahora = millis();
      std::string opt = id(modo_prueba).current_option();
      bool en_prueba = (opt != "Automático");
      static bool estaba_en_prueba = false;
      static std::string last_opt = "";
      Entradas ent{id(sensor_fondo).state, id(sensor_izq).state, id(sensor_der).state};
      Eval ev{Modo::REPOSO_READY, false, false};

      if (en_prueba) {
        estaba_en_prueba = true;
        // Tabla de valores sintéticos por opción (no toca histéresis ni temporizadores)
        const float NA = NAN;
        Entradas syn{NA, NA, NA};
        if (opt == "READY") { ev = {Modo::REPOSO_READY, false, false}; }
        else if (opt == "Retroceso") { ev = {Modo::RETROCESO, false, false}; syn = Entradas{80.0f, NA, NA}; }
        else if (opt == "Alineación centrada") { ev = {Modo::ALIN_CENTRADA, false, false}; syn = Entradas{NA, 30.0f, 30.0f}; }
        else if (opt == "Alineación corregir izq") { ev = {Modo::ALIN_DESV_DER, true, false}; syn = Entradas{NA, 45.0f, 30.0f}; }
        else if (opt == "Alineación corregir der") { ev = {Modo::ALIN_DESV_IZQ, false, true}; syn = Entradas{NA, 30.0f, 45.0f}; }
        else if (opt == "Aproximación Normal") { ev = {Modo::APROX_NORMAL, false, false}; syn = Entradas{120.0f, NA, NA}; }
        else if (opt == "Aproximación Precaución") { ev = {Modo::APROX_PRECAUCION, false, false}; syn = Entradas{35.0f, NA, NA}; }
        else if (opt == "Aproximación Alerta") { ev = {Modo::APROX_ALERTA, false, false}; syn = Entradas{15.0f, NA, NA}; }
        else if (opt == "STOP") { ev = {Modo::STOP_CRITICO, false, false}; syn = Entradas{8.0f, NA, NA}; }
        else if (opt == "Peligro Poste") {
          // Alterna como en producción (500 ms cada fase): STOP invertido ↔ alineación
          syn = Entradas{NA, 12.0f, 30.0f};
          if (((frame_counter / 5) % 2) == 1) { ev = {Modo::POSTE_PELIGRO, false, false}; }
          else { ev = {Modo::ALIN_DESV_IZQ, false, true}; }
        }
        else if (opt == "Inactividad") { ev = {Modo::INACTIVIDAD_READY, false, false}; syn = Entradas{8.0f, NA, NA}; }
        else if (opt == "Manual") {
          // Distancias ingresadas a mano: 0 (o NaN) = sin eco. A diferencia de
          // las opciones fijas, se evalúa la máquina de estados REAL (con su
          // histéresis y temporizadores) para ver cómo reacciona el sistema.
          float pf = id(prueba_fondo).state;
          float pi = id(prueba_izq).state;
          float pd = id(prueba_der).state;
          syn = Entradas{
            (!isnan(pf) && pf > 0.0f) ? pf : NA,
            (!isnan(pi) && pi > 0.0f) ? pi : NA,
            (!isnan(pd) && pd > 0.0f) ? pd : NA};
          ev = evalua_modo(syn, ahora);
        }
        ent = syn;
        // Publica sintéticos solo al cambiar de opción (round-robin pausado: no hay pelea).
        // OJO: se usa internal_send_state_to_frontend (bypass de filtros), NO
        // publish_state: los sintéticos ya vienen en cm y publish_state los
        // pasaría otra vez por el multiply x100 + la mediana x5 (22 -> 2200
        // en la web, mezclado con lecturas reales viejas).
        if (opt != last_opt) {
          last_opt = opt;
          id(sensor_fondo).internal_send_state_to_frontend(syn.fondo);
          id(sensor_izq).internal_send_state_to_frontend(syn.izq);
          id(sensor_der).internal_send_state_to_frontend(syn.der);
        }
        if (opt == "Manual") {
          // En Manual los valores cambian sin cambiar de opción: republicar
          // solo cuando alguna distancia manual cambió (evita spam cada 100 ms).
          static float pub_f = NAN, pub_i = NAN, pub_d = NAN;
          auto dist_changed = [](float a, float b) {
            if (isnan(a) && isnan(b)) return false;
            if (isnan(a) || isnan(b)) return true;
            return fabsf(a - b) > 0.001f;
          };
          if (dist_changed(syn.fondo, pub_f) || dist_changed(syn.izq, pub_i) || dist_changed(syn.der, pub_d)) {
            pub_f = syn.fondo; pub_i = syn.izq; pub_d = syn.der;
            id(sensor_fondo).internal_send_state_to_frontend(syn.fondo);
            id(sensor_izq).internal_send_state_to_frontend(syn.izq);
            id(sensor_der).internal_send_state_to_frontend(syn.der);
          }
        }
        dibuja_modo(ev.modo, ent, ev.dev_der, ev.dev_izq);
      } else {
        if (estaba_en_prueba) {
          // Al salir de prueba: resembrar referencias para no disparar falsos eventos
          estaba_en_prueba = false;
          last_opt = "";
          id(distancia_fondo_previa) = ent.fondo;
          id(estatico_desde_ms) = ahora;
        }
        ev = evalua_modo(ent, ahora);
        dibuja_modo(ev.modo, ent, ev.dev_der, ev.dev_izq);
      }

      // Textos publicados por modo (idénticos a los originales; prueba añade sufijo)
      std::string ms, ps;
      char buf_pub[44];
      switch (ev.modo) {
        case Modo::ARRANQUE_LISTO:
          ms = "En Espera / Listo (Arranque)"; ps = "[ wifi | ● radar ]"; break;
        case Modo::RETROCESO:
          ms = "Retroceso / Salida"; ps = "[      vv      ]"; break;
        case Modo::ALIN_CENTRADA:
        case Modo::ALIN_DESV_DER:
        case Modo::ALIN_DESV_IZQ:
          ms = "Alineación Lateral";
          if (ev.dev_der) { snprintf(buf_pub, sizeof(buf_pub), "[ %.0fcm << : ║ %.0fcm ]", ent.izq, ent.der); }
          else if (ev.dev_izq) { snprintf(buf_pub, sizeof(buf_pub), "[ %.0fcm >> : ║ %.0fcm ]", ent.izq, ent.der); }
          else { snprintf(buf_pub, sizeof(buf_pub), "[ %.0fcm | : | %.0fcm ]", ent.izq, ent.der); }
          ps = buf_pub; break;
        case Modo::POSTE_PELIGRO:
          ms = "Alineación - Peligro Poste"; ps = "[  S T O P  ]"; break;
        case Modo::STOP_CRITICO:
          ms = "Parada Crítica (STOP)"; ps = "[  S T O P  ]"; break;
        case Modo::INACTIVIDAD_READY:
          ms = "Estacionado (Pausa Inactividad)"; ps = "[ wifi | ● radar ]"; break;
        case Modo::APROX_NORMAL:
          ms = "Aproximación - Normal";
          snprintf(buf_pub, sizeof(buf_pub), "«   %.0f cm   »", ent.fondo); ps = buf_pub; break;
        case Modo::APROX_PRECAUCION:
          ms = "Aproximación - Precaución";
          snprintf(buf_pub, sizeof(buf_pub), "«   %.0f cm   »", ent.fondo); ps = buf_pub; break;
        case Modo::APROX_ALERTA:
          ms = "Aproximación - Alerta";
          snprintf(buf_pub, sizeof(buf_pub), "«   %.0f cm   »", ent.fondo); ps = buf_pub; break;
        case Modo::REPOSO_READY:
        default:
          ms = "En Espera / Sistema Listo"; ps = "[ wifi | ● radar ]"; break;
      }
      if (en_prueba) { ms += " (Prueba)"; }
      publish_modo(ms.c_str());
      publish_pantalla(ps.c_str());
