esphome:
  # El nombre define la dirección mDNS: http://garage.local (cuando está en la red del hogar)
  name: garage
  friendly_name: Asistente de Estacionamiento Autónomo

esp8266:
  board: nodemcuv2

logger:

# Servidor Web local en modo Punto de Acceso (Sin conexión exterior necesaria)
web_server:
  port: 80

wifi:
  # Sin SSID/clave en el YAML: la red del hogar se carga vía portal cautivo.
  # Si el router no está disponible, levanta el AP de abajo (abierto, solo setup).
  ap:
    ssid: "Asistente-Cochera-AP"

captive_portal:

ota:
  - platform: esphome

# Sin componente font: los 10 glifos 5x8 (READYSTOP_) van embebidos como tablas
# en el lambda del display (extraídos de spleen-5x8.bdf). Nada que subir junto al YAML.

# Variables Globales de Estado Interno
globals:
  - id: auto_estacionado_inicio
    type: bool
    initial_value: 'false'
  - id: distancia_fondo_previa
    type: float
    initial_value: '0.0'
  - id: flag_inicio
    type: bool
    initial_value: 'true'
  - id: estatico_desde_ms
    type: uint32
    initial_value: '0'
  - id: modo_ready_post_stop
    type: bool
    initial_value: 'false'
  - id: alerta_poste_on
    type: bool
    initial_value: 'true'

# Umbrales Configurables (Ajustables dinámicamente desde la interfaz Web)
number:
  - platform: template
    name: "Tiempo Inactividad STOP (s)"
    id: tiempo_inactividad_stop
    optimistic: true
    initial_value: 10
    min_value: 3
    max_value: 60
    step: 1

  - platform: template
    name: "Umbral Lateral (cm)"
    id: umbral_lateral
    optimistic: true
    initial_value: 50
    min_value: 10
    max_value: 100
    step: 5

  - platform: template
    name: "Umbral Desvío Chevron (cm)"
    id: umbral_desvio_chev
    optimistic: true
    initial_value: 5
    min_value: 1
    max_value: 20
    step: 0.5

  - platform: template
    name: "Umbral Poste Lateral (cm)"
    id: umbral_poste
    optimistic: true
    initial_value: 15
    min_value: 5
    max_value: 40
    step: 1

  - platform: template
    name: "Umbral Inicio (cm)"
    id: umbral_inicio
    optimistic: true
    initial_value: 150
    min_value: 50
    max_value: 250
    step: 10

  - platform: template
    name: "Umbral Precaucion (cm)"
    id: umbral_precaucion
    optimistic: true
    initial_value: 50
    min_value: 20
    max_value: 100
    step: 5

  - platform: template
    name: "Umbral Alerta (cm)"
    id: umbral_alerta
    optimistic: true
    initial_value: 20
    min_value: 10
    max_value: 40
    step: 2

  - platform: template
    name: "Umbral STOP (cm)"
    id: umbral_stop
    optimistic: true
    initial_value: 10
    min_value: 5
    max_value: 20
    step: 1

# Interruptor para activar/desactivar la alerta de poste (activada por defecto)
switch:
  - platform: template
    name: "Alerta Poste Lateral"
    id: sw_poste
    lambda: 'return id(alerta_poste_on);'
    turn_on_action:
      - lambda: 'id(alerta_poste_on) = true;'
    turn_off_action:
      - lambda: 'id(alerta_poste_on) = false;'

# Sensores Ultrasonido HC-SR04 (disparo secuencial round-robin + salida en cm)
# Fondo: trigger en GPIO16 (salida OK) y echo en GPIO12 (con interrupciones).
# GPIO16 no es apto como echo en ESP8266 (pin especial RTC sin interrupciones).
# Los 3 sensores usan update_interval: never y se disparan por turnos (ver interval),
# con 70 ms de separación garantizada para que ningún eco interfiera con otro.
sensor:
  - platform: ultrasonic
    trigger_pin: GPIO16
    echo_pin: GPIO12
    name: "Sensor Fondo"
    id: sensor_fondo
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0 # Conversión m a cm
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: ultrasonic
    trigger_pin: GPIO0
    echo_pin: GPIO5
    name: "Sensor Izquierda"
    id: sensor_izq
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: ultrasonic
    trigger_pin: GPIO15
    echo_pin: GPIO4
    name: "Sensor Derecha"
    id: sensor_der
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    filters:
      - multiply: 100.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

# Disparo secuencial por turnos (round-robin cada 70 ms -> cada sensor se mide cada 210 ms)
interval:
  - interval: 70ms
    then:
      - lambda: |-
          static uint8_t turno = 0;
          if (turno == 0) {
            id(sensor_fondo).update();
          } else if (turno == 1) {
            id(sensor_izq).update();
          } else {
            id(sensor_der).update();
          }
          turno = (turno + 1) % 3;

# Sensores de Texto para Simulación Web
text_sensor:
  - platform: template
    name: "Modo del Sistema"
    id: modo_sistema
    icon: "mdi:garage"

  - platform: template
    name: "Simulación de Pantalla LED (8x32)"
    id: texto_pantalla
    icon: "mdi:led-strip-scan"

# Bus SPI y Matriz LED MAX7219 (GPIO14 dedicado a CLK, CS en GPIO2)
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

display:
  - platform: max7219digit
    cs_pin: GPIO2
    num_chips: 4
    id: matriz_led
    scroll_enable: false
    update_interval: 100ms
    lambda: |-
      static int frame_counter = 0;
      frame_counter++;

      // Restaurar modo normal por defecto (STOP usa inversión parpadeante)
      it.invert_on_off(false);

      // Publicar solo cuando el valor cambia (evita saturar web_server)
      static std::string last_modo = "";
      static std::string last_pantalla = "";
      auto publish_modo = [&](const std::string &m) {
        if (m != last_modo) {
          last_modo = m;
          id(modo_sistema).publish_state(m);
        }
      };
      auto publish_pantalla = [&](const std::string &t) {
        if (t != last_pantalla) {
          last_pantalla = t;
          id(texto_pantalla).publish_state(t);
        }
      };

      // Chevron gráfico 5x3 (sin fuente): v hacia abajo (retroceso)
      auto chevron_down = [&](int x, int y) {
        it.line(x, y, x + 2, y + 2);
        it.line(x + 2, y + 2, x + 4, y);
      };
      // Rango X recortado en los dígitos: la barra lo tapa y se ve invertido
      int carve_x0 = 0;
      int carve_x1 = -1;

      // Dígitos 3x5 dibujados (sin fuente): 5 filas x 3 bits, bit 2 = columna izquierda
      static const uint8_t DIG35[10][5] = {
        {0b111, 0b101, 0b101, 0b101, 0b111}, // 0
        {0b001, 0b001, 0b001, 0b001, 0b001}, // 1
        {0b111, 0b001, 0b111, 0b100, 0b111}, // 2
        {0b111, 0b001, 0b111, 0b001, 0b111}, // 3
        {0b101, 0b101, 0b111, 0b001, 0b001}, // 4
        {0b111, 0b100, 0b111, 0b001, 0b111}, // 5
        {0b111, 0b100, 0b111, 0b101, 0b111}, // 6
        {0b111, 0b001, 0b001, 0b001, 0b001}, // 7
        {0b111, 0b101, 0b111, 0b101, 0b111}, // 8
        {0b111, 0b101, 0b111, 0b001, 0b111}, // 9
      };
      auto draw_digit35 = [&](int x, int y, int d) {
        for (int r = 0; r < 5; r++) {
          for (int c = 0; c < 3; c++) {
            int px = x + c;
            if (DIG35[d][r] & (1 << (2 - c))) {
              if (px >= carve_x0 && px <= carve_x1) {
                // Dentro de la barra: borra el píxel (calado en negativo)
                it.draw_pixel_at(px, y + r, esphome::display::COLOR_OFF);
              } else {
                it.draw_pixel_at(px, y + r, esphome::display::COLOR_ON);
              }
            }
          }
        }
      };
      auto draw_num35 = [&](int x, int y, int n) {
        if (n < 0) n = 0;
        if (n > 999) n = 999;
        if (n >= 100) {
          draw_digit35(x, y, n / 100);
          draw_digit35(x + 4, y, (n / 10) % 10);
          draw_digit35(x + 8, y, n % 10);
        } else if (n >= 10) {
          draw_digit35(x, y, n / 10);
          draw_digit35(x + 4, y, n % 10);
        } else {
          draw_digit35(x, y, n);
        }
      };
      // Chevron ^ de 7x4 para aproximación (bit 6 = col izq), con calado como dígitos
      static const uint8_t CHEV7[4] = {0b0001000, 0b0010100, 0b0100010, 0b1000001};
      auto draw_chev7 = [&](int x, int y) {
        for (int r = 0; r < 4; r++) {
          for (int c = 0; c < 7; c++) {
            int px = x + c, py = y + r;
            if (py < 0 || py > 7) continue;
            if (CHEV7[r] & (1 << (6 - c))) {
              if (px >= carve_x0 && px <= carve_x1) {
                it.draw_pixel_at(px, py, esphome::display::COLOR_OFF);
              } else {
                it.draw_pixel_at(px, py, esphome::display::COLOR_ON);
              }
            }
          }
        }
      };
      // Chevrones 3x5 a la altura de los dígitos: > hacia derecha, < hacia izquierda
      auto chevron_right = [&](int x, int y) {
        it.line(x, y, x + 2, y + 2);
        it.line(x + 2, y + 2, x, y + 4);
      };
      auto chevron_left = [&](int x, int y) {
        it.line(x + 2, y, x, y + 2);
        it.line(x, y + 2, x + 2, y + 4);
      };

      // Glifos 5x8 propios (extraídos de spleen-5x8.bdf; sin archivo externo).
      // Orden: R,E,A,D,Y,S,T,O,P,_ — avance 5px, idéntico a la fuente original.
      static const uint8_t GLYPH58[10][8] = {
        {0b00000, 0b11100, 0b10010, 0b10010, 0b11100, 0b10010, 0b10010, 0b00000}, // R
        {0b00000, 0b01110, 0b10000, 0b11100, 0b10000, 0b10000, 0b01110, 0b00000}, // E
        {0b00000, 0b01100, 0b10010, 0b10010, 0b11110, 0b10010, 0b10010, 0b00000}, // A
        {0b00000, 0b11100, 0b10010, 0b10010, 0b10010, 0b10010, 0b11100, 0b00000}, // D
        {0b00000, 0b10010, 0b10010, 0b10010, 0b01110, 0b00010, 0b11100, 0b00000}, // Y
        {0b00000, 0b01110, 0b10000, 0b01100, 0b00010, 0b00010, 0b11100, 0b00000}, // S
        {0b00000, 0b11111, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00000}, // T
        {0b00000, 0b01100, 0b10010, 0b10010, 0b10010, 0b10010, 0b01100, 0b00000}, // O
        {0b00000, 0b11100, 0b10010, 0b10010, 0b11100, 0b10000, 0b10000, 0b00000}, // P
        {0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b11110}, // _
      };
      auto glyph58_idx = [&](char c) -> int {
        switch (c) {
          case 'R': return 0; case 'E': return 1; case 'A': return 2; case 'D': return 3;
          case 'Y': return 4; case 'S': return 5; case 'T': return 6; case 'O': return 7;
          case 'P': return 8; case '_': return 9;
          default: return -1;
        }
      };
      auto draw_text58 = [&](int x, int y, const char *s) {
        int cx = x;
        for (const char *p = s; *p; p++) {
          int g = glyph58_idx(*p);
          if (g >= 0) {
            for (int r = 0; r < 8; r++) {
              for (int c = 0; c < 5; c++) {
                if (GLYPH58[g][r] & (1 << (4 - c))) {
                  it.draw_pixel_at(cx + c, y + r, esphome::display::COLOR_ON);
                }
              }
            }
          }
          cx += 5;
        }
      };
      // Prompt retro: READY_ con guion parpadeante (6 glifos x 5px = x 1..30), brillo máximo
      auto print_ready_prompt = [&]() {
        it.set_intensity(15);
        draw_text58(1, 0, "READY");
        if ((frame_counter / 5) % 2 == 0) {
          draw_text58(26, 0, "_");
        }
      };

      float fondo = id(sensor_fondo).state;
      float izq = id(sensor_izq).state;
      float der = id(sensor_der).state;

      // Histéresis de 2 cm (evita parpadeo en fronteras): se entra con el nominal y se sale con + margen.
      // Se evalúa ANTES que cualquier return: la alineación lateral es prioritaria
      // y no depende del eco de fondo (un NaN trasero no debe tapar el guiado entre columnas).
      static const float HIST_CM = 2.0;
      static bool h_stop = false;
      static bool h_alerta = false;
      static bool h_prec = false;
      static bool h_ini = false;
      static bool h_lat = false;
      static bool h_poste = false;
      static bool h_dev_der = false;
      static bool h_dev_izq = false;

      // Entra con v <= lim, sale con v > lim + HIST_CM
      auto hyst_le = [&](bool &s, float v, float lim) {
        if (s) s = (v <= lim + HIST_CM);
        else s = (v <= lim);
      };
      // Entra con v > lim, sale con v < lim - 1 (para desvíos)
      auto hyst_gt = [&](bool &s, float v, float lim) {
        if (s) s = !(v < lim - 1.0);
        else s = (v > lim);
      };

      // Validación de alineación: AMBOS sensores deben detectar el auto <= umbral (+ histéresis si ya activo)
      float lim_lat = id(umbral_lateral).state + (h_lat ? HIST_CM : 0.0);
      bool auto_lat_izq = (!isnan(izq) && izq > 0.0 && izq <= lim_lat);
      bool auto_lat_der = (!isnan(der) && der > 0.0 && der <= lim_lat);
      bool pres_lateral = auto_lat_izq && auto_lat_der;
      h_lat = pres_lateral;

      // Banderas laterales: solo se usan con pres_lateral (ambos válidos), el NaN no las contamina
      float lat_min = (izq < der) ? izq : der;
      hyst_le(h_poste, lat_min, id(umbral_poste).state);
      hyst_gt(h_dev_der, izq - der, id(umbral_desvio_chev).state);
      hyst_gt(h_dev_izq, der - izq, id(umbral_desvio_chev).state);

      // 1. ESTADO ALINEACIÓN LATERAL (prioritario: no depende del fondo)
      if (pres_lateral) {
        // Peligro de poste: alterna con STOP invertido fijo.

        if (id(alerta_poste_on) && h_poste && ((frame_counter / 5) % 2 == 1)) {
          it.invert_on_off(true);
          it.set_intensity(12);
          draw_text58(4, 0, "STOP");

          publish_modo("Alineación - Peligro Poste");
          publish_pantalla("[  S T O P  ]");
          return;
        }

        it.set_intensity(15);

        float dif_mm = (izq - der) * 10.0;

        // Distancias (primero: la barra las recorta al taparlas)
        int ni = (int)izq;
        int nd = (int)der;
        if (ni < 0) ni = 0;
        if (ni > 99) ni = 99;
        if (nd < 0) nd = 0;
        if (nd > 99) nd = 99;

        // Barra de progreso sólida desde el centro, toda la altura (filas 0-7).
        bool centrado = (!h_dev_der && !h_dev_izq);
        int pos_x = 15 + (int)(dif_mm / 20.0);
        if (pos_x < 0) pos_x = 0;
        if (pos_x > 31) pos_x = 31;
        int bar_x0, bar_x1;
        if (centrado) { bar_x0 = 15; bar_x1 = 16; }
        else if (pos_x > 16) { bar_x0 = 16; bar_x1 = pos_x; }
        else { bar_x0 = pos_x; bar_x1 = 15; }
        carve_x0 = bar_x0;
        carve_x1 = bar_x1;

        // Chevrones de corrección 3x5 a la altura de los dígitos (filas 1-5),
        // en el hueco entre el centro y el número, del lado libre. Sin ticks.
        int slide = (frame_counter / 6) % 2;
        if (h_dev_der) {
          // Pegado a DERECHA: << a la izquierda (corregir a la izquierda)
          chevron_left(8 - slide, 1);
          chevron_left(11 - slide, 1);
        }
        if (h_dev_izq) {
          // Pegado a IZQUIERDA: >> a la derecha (corregir a la derecha)
          chevron_right(17 + slide, 1);
          chevron_right(20 + slide, 1);
        }
        // Barra sólida a toda altura PRIMERO; los dígitos se calan en negativo encima
        for (int x = bar_x0; x <= bar_x1; x++) {
          it.vertical_line(x, 0, 8);
        }

        // Distancias contra los márgenes, centradas verticalmente (filas 1-5):
        // fuera de la barra en ON, dentro en OFF (invertido)
        draw_num35(0, 1, ni);
        int wd = (nd >= 10) ? 8 : 3;
        draw_num35(32 - wd, 1, nd);

        publish_modo("Alineación Lateral");

        // La matriz es gráfica (ver nota); los valores en cm van a la simulación web.
        char buf_lat[40];
        if (h_dev_der) {
          snprintf(buf_lat, sizeof(buf_lat), "[ %.0fcm << : ║ %.0fcm ]", izq, der);
          publish_pantalla(std::string(buf_lat));
        } else if (h_dev_izq) {
          snprintf(buf_lat, sizeof(buf_lat), "[ %.0fcm >> : ║ %.0fcm ]", izq, der);
          publish_pantalla(std::string(buf_lat));
        } else {
          snprintf(buf_lat, sizeof(buf_lat), "[ %.0fcm | : | %.0fcm ]", izq, der);
          publish_pantalla(std::string(buf_lat));
        }
        return;
      }

      // Lectura inválida: se muestra como reposo (sin estado de fallo dedicado).
      // No tocar temporizadores ni distancia previa, no congelar variables.
      bool fondo_valido = (!isnan(fondo) && fondo > 0.0);
      if (!fondo_valido) {
        print_ready_prompt();

        publish_modo("En Espera / Sistema Listo");
        publish_pantalla("[   R E A D Y   ]");
        return;
      }

      // Flags de fondo (requieren lectura válida; lo lateral ya se evaluó arriba)
      hyst_le(h_stop, fondo, id(umbral_stop).state);
      hyst_le(h_alerta, fondo, id(umbral_alerta).state);
      hyst_le(h_prec, fondo, id(umbral_precaucion).state);
      hyst_le(h_ini, fondo, id(umbral_inicio).state);

      // Evaluación de movimiento y marcha atrás
      float prev = id(distancia_fondo_previa);
      float diff = fabsf(fondo - prev);
      bool en_movimiento = (diff > 1.0);
      bool retrocediendo = (prev > 0.0) && (fondo > prev + 1.0);
      id(distancia_fondo_previa) = fondo;

      uint32_t ahora = millis();

      // Gestión de temporizador de inactividad
      if (en_movimiento) {
        id(estatico_desde_ms) = ahora;
        id(modo_ready_post_stop) = false;
      } else if (id(estatico_desde_ms) == 0) {
        id(estatico_desde_ms) = ahora;
      }

      uint32_t tiempo_estatico_ms = ahora - id(estatico_desde_ms);
      uint32_t limite_inactividad_ms = (uint32_t)(id(tiempo_inactividad_stop).state * 1000.0);

      // 2. EVALUACIÓN DE ARRANQUE CON AUTO ESTACIONADO
      if (id(flag_inicio)) {
        // Siembra la referencia para no disparar un falso retroceso en el primer frame
        id(distancia_fondo_previa) = fondo;
        retrocediendo = false;
        if (fondo <= id(umbral_alerta).state) {
          id(auto_estacionado_inicio) = true;
        }
        id(flag_inicio) = false;
      }

      if (retrocediendo || fondo < prev - 2.0) {
        id(auto_estacionado_inicio) = false;
      }

      // 3. ESTADO AUTO ESTACIONADO AL ENCENDER -> "READY"
      if (id(auto_estacionado_inicio) && !retrocediendo && !pres_lateral) {
        print_ready_prompt();

        publish_modo("En Espera / Listo (Arranque)");
        publish_pantalla("[   R E A D Y   ]");
        return;
      }

      // 4. ESTADO RETROCESO / ALEJAMIENTO (Chevrones gráficos hacia abajo)
      if (retrocediendo && !pres_lateral) {
        it.set_intensity(15);

        int offset_y = (frame_counter / 3) % 8;
        chevron_down(1, offset_y);
        chevron_down(26, offset_y);

        publish_modo("Retroceso / Salida");
        publish_pantalla("[      vv      ]");
        return;
      }

      // 5. ESTADO STOP / TRANSICIÓN A READY POR INACTIVIDAD
      if (h_stop) {
        if (tiempo_estatico_ms >= limite_inactividad_ms) {
          id(modo_ready_post_stop) = true;
        }

        if (id(modo_ready_post_stop)) {
          print_ready_prompt();

          publish_modo("Estacionado (Pausa Inactividad)");
          publish_pantalla("[   R E A D Y   ]");
          return;
        }

        // STOP fijo en invertido (fondo encendido / texto apagado) con parpadeo de brillo 12 <-> 7
        it.invert_on_off(true);
        if ((frame_counter / 3) % 2 == 0) {
          it.set_intensity(12);
        } else {
          it.set_intensity(7);
        }

        draw_text58(4, 0, "STOP");

        publish_modo("Parada Crítica (STOP)");
        publish_pantalla("[  S T O P  ]");
        return;
      }

      // 6. ESTADO APROXIMACIÓN (Avanzando hacia la pared)
      if (h_ini) {

        if (h_alerta) {
          publish_modo("Aproximación - Alerta");
          // Parpadeo como en STOP (dos niveles), sin inversión para distinguirlo
          if ((frame_counter / 3) % 2 == 0) {
            it.set_intensity(12);
          } else {
            it.set_intensity(7);
          }
        } else if (h_prec) {
          publish_modo("Aproximación - Precaución");
          it.set_intensity(15);
        } else {
          publish_modo("Aproximación - Normal");
          it.set_intensity(15);
        }

        // Barra de progreso L->R según proximidad (vacía en inicio, llena en stop)
        float u_ini = id(umbral_inicio).state;
        float u_stop = id(umbral_stop).state;
        float denom = u_ini - u_stop;
        if (denom < 1.0) denom = 1.0;
        int fill = (int)(((u_ini - fondo) / denom) * 32.0);
        if (fill < 0) fill = 0;
        if (fill > 32) fill = 32;
        carve_x0 = 0;
        carve_x1 = fill - 1;
        for (int x = 0; x < fill; x++) {
          it.vertical_line(x, 0, 8);
        }

        // Distancia en dígitos 3x5 a la izquierda, centrada vertical (filas 1-5)
        int nf = (int)(fondo + 0.5);
        draw_num35(0, 1, nf);

        // Chevron ^ de 7px a la derecha, scroll arriba con velocidad por tier
        int delay_scroll = h_prec ? 8 : 4;
        int offset_y = 7 - ((frame_counter / delay_scroll) % 8);
        draw_chev7(24, offset_y);

        char buf[30];
        snprintf(buf, sizeof(buf), "«   %.0f cm   »", fondo);
        publish_pantalla(std::string(buf));
        return;
      }

      // 7. ESTADO REPOSO / REPAUSO GENERAL
      print_ready_prompt();

      publish_modo("En Espera / Sistema Listo");
      publish_pantalla("[   R E A D Y   ]");
